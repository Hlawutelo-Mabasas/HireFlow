<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - HireFlow</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .jobs-header { padding: 40px; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; text-align: center; }
        .jobs-header h1 { font-size: 36px; margin-bottom: 10px; }
        .jobs-container { padding: 40px; max-width: 900px; margin: 0 auto; }
        .job-card { background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-left: 4px solid #d4af37; transition: all 0.2s; }
        .job-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .job-title { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .job-company { color: #d4af37; font-weight: 600; font-size: 14px; }
        .job-meta { display: flex; gap: 20px; margin: 12px 0; font-size: 13px; color: #888; }
        .job-desc { color: #555; line-height: 1.6; margin: 15px 0; }
        .job-footer { display: flex; gap: 10px; }
        .btn-apply { background: #007bff; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="../index.html" class="navbar-brand">
            <span class="brand-icon">&#9670;</span>
            <span class="brand-name">Hire<span>Flow</span></span>
        </a>
        <nav class="navbar-links">
            <a href="../index.html" class="nav-item">Home</a>
            <a href="pricing.html" class="nav-item">Pricing</a>
            <div class="nav-separator"></div>
            <a href="login.html" class="nav-item">Login</a>
            <a href="register.html" class="nav-item btn-nav-primary">Get Started</a>
        </nav>
    </header>
    <div class="jobs-header">
        <h1>Browse Open Jobs</h1>
        <p>Find your next opportunity with HireFlow</p>
    </div>
    <div class="jobs-container">
        <div id="alertBox" class="alert"></div>
        <div id="jobsList" style="text-align: center; padding: 40px; color: #888;">Loading jobs...</div>
    </div>
    <footer>
        <p>&copy; 2024 <span>HireFlow</span> Recruitment SaaS Platform. Built with Spring Boot and PostgreSQL.</p>
    </footer>
    <script src="../js/api.js"></script>
    <script>
        async function loadJobs() {
            try {
                const jobs = await getAllOpenJobs();
                const container = document.getElementById("jobsList");
                if (!jobs || jobs.length === 0) {
                    container.innerHTML = '<div class="no-jobs"><p>No jobs available at the moment. Check back soon!</p></div>';
                    return;
                }
                let html = '';
                jobs.forEach(job => {
                    html += `<div class="job-card"><div class="job-title">${job.title}</div><div class="job-company">${job.company.companyName || 'Company'}</div><div class="job-meta"><span>Location: ${job.location || 'TBD'}</span><span>Salary: ${job.salary || 'TBD'}</span></div><div class="job-desc">${job.description || 'No description'}</div><div class="job-footer"><button class="btn-apply" onclick="handleApply(${job.id})">Apply Now</button></div></div>`;
                });
                container.innerHTML = html;
            } catch (error) {
                document.getElementById("jobsList").innerHTML = '<p>Error loading jobs.</p>';
            }
        }
        function handleApply(jobId) {
            const user = getSession();
            if (!user) { window.location.href = "login.html"; return; }
            if (user.role !== "CANDIDATE") { showAlert("alertBox", "Only candidates can apply.", "error"); return; }
            const coverLetter = prompt("Enter your cover letter:");
            if (coverLetter) {
                applyForJob(user.userId, jobId, coverLetter).then(res => {
                    if (res.error) showAlert("alertBox", res.error, "error");
                    else showAlert("alertBox", "Applied successfully!", "success");
                });
            }
        }
        loadJobs();
    </script>
</body>
</html>
